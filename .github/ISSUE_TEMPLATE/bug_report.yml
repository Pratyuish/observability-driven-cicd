name: Bug report
description: Report incorrect or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands, manifests, or workflow steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Kubernetes version, kind/k3d/cloud, and commit SHA.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: Remove secrets before pasting logs or screenshots.
