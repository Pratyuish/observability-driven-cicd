version: 1

service:
  name: demo-api
  environment: production

gates:
  availability:
    enabled: true
    minimum_percent: 99.0
    query: |
      100 *
      sum(rate(http_server_requests_total{status!~"5.."}[5m]))
      /
      sum(rate(http_server_requests_total[5m]))

  error_rate:
    enabled: true
    maximum_percent: 1.0
    query: |
      100 *
      sum(rate(http_server_requests_total{status=~"5.."}[5m]))
      /
      sum(rate(http_server_requests_total[5m]))

  latency_p95:
    enabled: true
    maximum_ms: 500
    query: |
      1000 *
      histogram_quantile(
        0.95,
        sum by (le) (
          rate(http_server_request_duration_seconds_bucket[5m])
        )
      )

  pod_restarts:
    enabled: true
    maximum_delta: 2
    query: |
      sum(increase(kube_pod_container_status_restarts_total[10m]))

  synthetic_transaction:
    enabled: true
    minimum_percent: 99.0

policy:
  on_gate_failure: block
  require_all_enabled_gates: true
  remediation_mode: advisory
