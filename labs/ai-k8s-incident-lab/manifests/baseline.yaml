
# manifests/baseline.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy-app
  namespace: ai-incidents
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthy-app
  template:
    metadata:
      labels:
        app: healthy-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: healthy-app
  namespace: ai-incidents
spec:
  selector:
    app: healthy-app
  ports:
    - port: 80
      targetPort: 80

